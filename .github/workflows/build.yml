name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            binary: build/mdcat
            cache_path: ~/.cache/vcpkg/archives
          - os: windows-latest
            triplet: x64-windows
            binary: build/Release/mdcat.exe
            cache_path: ~/AppData/Local/vcpkg/archives

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
        shell: bash

      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache_path }}
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        shell: bash
        run: |
          "${{ matrix.binary }}" --help
          "${{ matrix.binary }}" examples/tables.md
