name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-x64-linux-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: "$VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-and-quality

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"
          output: sarif-results

      - name: Convert SARIF to CSV
        uses: mr-sherman/sarif-to-csv@v2.4
        with:
          input-file: sarif-results/cpp.sarif
          output-file: sarif-results/results.csv

      - name: Upload CSV report
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results-csv
          path: sarif-results/results.csv
